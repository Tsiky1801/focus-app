<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Focus — App de concentration pour étudiants</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #1a1a2e; color: white; text-align: center; }
  header { padding: 60px 20px; background: #16213e; }
  h1 { font-size: 48px; }
  .btn { background: #e94560; color: white; padding: 15px 30px; border-radius: 30px; text-decoration: none; font-size: 18px; }
  section { padding: 40px 20px; }
  .card { background: #16213e; margin: 10px auto; padding: 20px; border-radius: 15px; max-width: 600px; }

<body>
  <header>
    <h1>🎓 Focus</h1>

  </header>
  <section>
    <h2>Fonctionnalités</h2>
    <div class="card">⏱️ Minuteur de concentration</div>
    <div class="card">🎵 Musique de fond (lo-fi, pluie, piano)</div>
    <div class="card">📊 Statistiques et progrès</div>
    <div class="card">🔥 Streaks et badges</div>
  </section>
