name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        working-directory: focus-app/android
        run: |
          mkdir -p "$HOME/.android" && cp ../flutter/debug.keystore "$HOME/.android/debug.keystore"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-app
          path: focus-app/android/app/build/outputs/apk/debug/app-debug.apk
