name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create flutter project
        run: |
          flutter create --platforms android --org com.example.focus_player focus_tmp
          for f in focus_tmp/android/build.gradle.kts focus_tmp/android/settings.gradle.kts focus_tmp/android/build.gradle focus_tmp/android/settings.gradle; do
            if [ -f "$f" ]; then
              sed -i 's/\(id("com.android.application") version "\)[^"]*"/\17.4.2"/' "$f"
              sed -i "s/\(id 'com.android.application' version '\)[^']*'/\17.4.2'/" "$f"
              sed -i 's/\(id("org.jetbrains.kotlin.android") version "\)[^"]*"/\11.9.24"/' "$f"
              sed -i "s/\(id 'org.jetbrains.kotlin.android' version '\)[^']*'/\11.9.24'/" "$f"
            fi
          done
          sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-7.6.4-all.zip|' focus_tmp/android/gradle/wrapper/gradle-wrapper.properties
          grep -rn "com.android.application" focus_tmp/android --include="*.kts" --include="*.gradle" || true
          cp focus-app/flutter/pubspec.yaml focus_tmp/pubspec.yaml
          cp focus-app/flutter/lib/main.dart focus_tmp/lib/main.dart
          cp focus-app/flutter/AndroidManifest.xml focus_tmp/android/app/src/main/AndroidManifest.xml
          cd focus_tmp && flutter pub get && flutter build apk --debug --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-player-arm64
          path: focus_tmp/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
