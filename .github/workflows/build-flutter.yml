name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create flutter project
        run: |
          flutter create --platforms android --org com.example.focus_player focus_tmp
          cp focus-app/flutter/pubspec.yaml focus_tmp/pubspec.yaml
          cp focus-app/flutter/lib/main.dart focus_tmp/lib/main.dart
          cp focus-app/flutter/AndroidManifest.xml focus_tmp/android/app/src/main/AndroidManifest.xml
          cd focus_tmp && flutter pub get
          PLUGIN=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -name "on_audio_query_android-*" | head -1)/android/build.gradle
          if [ -f "$PLUGIN" ]; then
            grep -q "namespace" "$PLUGIN" || sed -i "s/^android {/android {\n    namespace 'com.example.focus_player.onaudio'\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }/" "$PLUGIN"
            PMANIFEST=$(dirname "$PLUGIN")/src/main/AndroidManifest.xml
            if [ -f "$PMANIFEST" ]; then
              sed -i 's/ package="com.lucasjosino.on_audio_query"//' "$PMANIFEST"
            fi
            sed -i "s/compileSdkVersion 33/compileSdkVersion 34/" "$PLUGIN"
            sed -i "s/compileSdkVersion 32/compileSdkVersion 34/" "$PLUGIN"
            echo "--- plugin patch ---"
            head -20 "$PLUGIN"
          fi
          flutter build apk --debug --split-per-abi
          # Re-signe chaque APK avec le keystore stable du créateur (sinon chaque run a une clé différente)
          APKDIR="$GITHUB_WORKSPACE/focus_tmp/build/app/outputs/flutter-apk"
          KS="$GITHUB_WORKSPACE/focus-app/flutter/debug.keystore"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          for APK in "$APKDIR"/app-*-debug.apk; do
            [ -f "$APK" ] || continue
            "$BT/zipalign" -f 4 "$APK" "$APK".aligned
            "$BT/apksigner" sign --ks "$KS" \
              --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
              --out "$APK" "$APK".aligned
            rm -f "$APK".aligned
            "$BT/apksigner" verify --print-certs "$APK"
          done
          ls -l "$APKDIR"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-player-arm64
          path: focus_tmp/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
