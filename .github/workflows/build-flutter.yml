name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create flutter project
        run: |
          yes | sdkmanager "platforms;android-34" >/dev/null || true
          flutter create --org com.example.focus_player focus_tmp
          cp focus-app/flutter/pubspec.yaml focus_tmp/pubspec.yaml
          cp focus-app/flutter/lib/main.dart focus_tmp/lib/main.dart
          cp focus-app/flutter/AndroidManifest.xml focus_tmp/android/app/src/main/AndroidManifest.xml
          cd focus_tmp && flutter pub get
          # AGP 8 (Flutter récent) exige "namespace" — corrige les vieux plugins qui n'en ont pas
          find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 3 -type d -name android | while read -r d; do
            g="$d/build.gradle"
            [ -f "$g" ] || continue
            grep -Eq '^[[:space:]]*namespace[[:space:]]' "$g" && continue
            m="$d/src/main/AndroidManifest.xml"
            [ -f "$m" ] || continue
            NS=$(grep -o 'package="[^"]*"' "$m" | head -1 | sed 's/package="//;s/"//')
            [ -z "$NS" ] && continue
            sed -i "s/^android {/android {\n    namespace \"$NS\"\n    compileOptions {\n      sourceCompatibility JavaVersion.VERSION_17\n      targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n      jvmTarget = '17'\n    }/" "$g"
            sed -i 's/ package="[^"]*"//' "$m"
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 35/' "$g"
            echo "namespace ajouté: $NS → $g"
            sed -i 's/compileSdkVersion 3[0-3]/compileSdkVersion 34/' "$g" && echo "compileSdk → 34: $g"
          done
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-player
          path: focus_tmp/build/app/outputs/flutter-apk/app-debug.apk
